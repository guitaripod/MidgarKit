name: StoreKitHost
options:
  bundleIdPrefix: app.midgar.storekithost
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
    visionOS: "1.0"

packages:
  MidgarKit:
    path: ../..

targets:
  StoreKitHost:
    type: application
    supportedDestinations: [iOS, macOS, tvOS, visionOS]
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.midgar.storekithost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
  StoreKitHostTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS, tvOS, visionOS]
    sources:
      - path: ../MidgarCommerceTests/StoreKitIntegrationTests.swift
      - path: ../MidgarCommerceTests/CommerceFakes.swift
      - path: ../MidgarCommerceTests/CommerceHTTPStub.swift
      - path: ../MidgarCommerceTests/Products.storekit
        buildPhase: resources
      - path: ../MidgarCommerceUITests/PaywallSnapshotTests.swift
      - path: ../MidgarCommerceUITests/PlanPaywallSnapshotTests.swift
      - path: ../MidgarCommerceUITests/Paywall.storekit
        buildPhase: resources
    dependencies:
      - target: StoreKitHost
      - package: MidgarKit
        product: MidgarCommerce
      - package: MidgarKit
        product: MidgarCommerceUI
      - package: MidgarKit
        product: MidgarUI
      - package: MidgarKit
        product: MidgarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.midgar.storekithost.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/StoreKitHost.app/Contents/MacOS/StoreKitHost"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"

schemes:
  StoreKitHost:
    build:
      targets:
        StoreKitHost: all
        StoreKitHostTests: [test]
    run:
      storeKitConfiguration: ../MidgarCommerceTests/Products.storekit
    test:
      storeKitConfiguration: ../MidgarCommerceTests/Products.storekit
      commandLineArguments:
        "-AppleLocale en_US": true
        "-AppleLanguages (en)": true
      targets:
        - StoreKitHostTests
