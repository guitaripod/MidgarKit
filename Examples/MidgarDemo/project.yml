name: MidgarDemo
options:
  bundleIdPrefix: com.marcusziade
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  MidgarKit:
    path: ../..

targets:
  MidgarDemo:
    type: application
    platform: iOS
    sources:
      - path: MidgarDemo
    dependencies:
      - package: MidgarKit
    info:
      path: MidgarDemo/Info.plist
      properties:
        CFBundleDisplayName: Midgar Demo
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        CFBundleURLTypes:
          - CFBundleURLName: com.marcusziade.MidgarDemo
            CFBundleURLSchemes:
              - com.marcusziade.midgardemo
        LSApplicationQueriesSchemes:
          - com.guitaripod.embr
          - com.guitaripod.helia
          - com.guitaripod.payday
          - com.guitaripod.pixie
          - com.guitaripod.psybeam
          - com.guitaripod.tailscode
          - com.marcusziade.aotd
          - com.marcusziade.doublekick
          - com.marcusziade.dreameater
          - com.marcusziade.inventory
          - com.marcusziade.knowtheflag
          - com.marcusziade.psywave
          - com.marcusziade.sforesight
          - com.marcusziade.solarbeam
          - com.midgarcorp.flaccy
          - com.midgarcorp.flaccy.mac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcusziade.MidgarDemo
        DEVELOPMENT_TEAM: P4DQK6SRKR
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: MidgarDemo Dev 2026
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
